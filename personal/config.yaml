# Personal lifestyle targets (edit anytime)

# Used by: scripts/personal_week_summary.py → Lifestyle score /100

targets:
  sleep_h_min: 7.0
  sleep_h_max: 9.0
  sleep_quality_min: 6          # 1–10
  deep_work_h_week: 10.0
  workouts_week: 3
  nutrition_days_week: 7        # days with a nutrition file
  metrics_days_week: 7          # days with sleep_h or weight filled in CSV

# Point weights must sum to 100
weights:
  sleep: 25
  habits: 25
  deep_work: 20
  nutrition_days: 15
  metrics_days: 15

# Habit marks in habits/YYYY-MM.md
habit_marks:
  done: ["x", "X", "✅"]
  partial: ["~", "≈"]
  miss: ["-", "0"]
